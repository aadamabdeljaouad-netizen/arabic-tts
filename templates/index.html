<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>arabic-tts | تحويل النص العربي إلى صوت</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 16px;
            background: #f3f6fb;
            color: #18243b;
            font-family: Tahoma, Arial, sans-serif;
            line-height: 1.8;
        }
        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 32px;
            background: #ffffff;
            border: 1px solid #e3e9f2;
            border-radius: 20px;
            box-shadow: 0 12px 36px rgba(24, 36, 59, 0.07);
        }
        .brand { margin: 0; color: #3156be; font-weight: bold; }
        h1 { margin: 8px 0 12px; font-size: clamp(1.5rem, 4vw, 2rem); line-height: 1.5; }
        .description, .hint { color: #526079; }
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        label { display: block; margin: 16px 0 6px; font-weight: bold; }
        textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            border: 1px solid #bcc8da;
            border-radius: 12px;
            resize: vertical;
            font: inherit;
            background: #fbfcff;
            color: inherit;
        }
        textarea:focus, select:focus { border-color: #3156be; outline: 3px solid rgba(49, 86, 190, 0.15); }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bcc8da;
            border-radius: 10px;
            background: #fbfcff;
            font: inherit;
        }
        .features-badge {
            margin: 16px 0;
            padding: 10px 14px;
            background: #eef3ff;
            border-radius: 10px;
            color: #2a4aa1;
            font-size: 0.88rem;
        }
        .hint { margin: 8px 0 18px; font-size: 0.88rem; }
        button, .download {
            display: inline-block;
            padding: 12px 22px;
            border: 0;
            border-radius: 10px;
            background: #3156be;
            color: #ffffff;
            font: inherit;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        button:hover, .download:hover { background: #234398; }
        button:disabled { opacity: 0.65; cursor: wait; }
        #status { color: #234398; }
        .error {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            background: #fff0f0;
            color: #9e2020;
            overflow-wrap: anywhere;
        }
        .result { margin-top: 28px; padding-top: 18px; border-top: 1px solid #e3e9f2; }
        audio { display: block; width: 100%; margin: 12px 0 18px; }
        footer { margin-top: 26px; color: #526079; font-size: 0.85rem; }
        [hidden] { display: none !important; }
        @media (max-width: 520px) {
            body { padding: 20px 12px; }
            main { padding: 22px 18px; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <p class="brand"><bdi>arabic-tts</bdi></p>
        <h1>حوّل النص العربي إلى صوت</h1>
        <p class="description">اكتب نصًا عربيًا واستمع إليه مع تحسين الأرقام والسرعة والوقفات.</p>
    </header>

    <form id="tts-form" action="{{ url_for('generate') }}" method="post">
        <label for="text">النص العربي</label>
        <textarea id="text" name="text" maxlength="{{ max_length }}" placeholder="مرحبًا بكم! اكتب أرقامًا مثل 2026 وسيتم نطقها بالكلمات تلقائيًا." required></textarea>

        <div class="controls-grid">
            <div>
                <label for="speed">سرعة القراءة</label>
                <select id="speed" name="speed">
                    <option value="0.8">بطيء (0.8x)</option>
                    <option value="1.0" selected>عادي (1.0x)</option>
                    <option value="1.2">سريع (1.2x)</option>
                </select>
            </div>
        </div>

        <div class="features-badge"><b>تحسينات تلقائية:</b> تحويل الأرقام إلى كلمات وتنظيم الوقفات.</div>
        <button id="submit-button" type="submit">حوّل النص إلى صوت</button>
    </form>

    <p id="status" role="status" aria-live="polite" hidden></p>
    <p id="error" class="error" role="alert" {% if not error %}hidden{% endif %}>{{ error or "" }}</p>

    <section id="result" class="result" hidden>
        <h2>التسجيل الصوتي</h2>
        <audio id="audio-player" controls preload="metadata">متصفحك لا يدعم تشغيل الصوت.</audio>
        <a id="download-link" class="download" download="arabic-tts.wav">تحميل الصوت</a>
    </section>

    <footer>يُولّد الصوت محليًا باستخدام Piper دون أي خوادم خارجية.</footer>
</main>

<script>
    "use strict";
    const form = document.getElementById("tts-form");
    const textInput = document.getElementById("text");
    const speedInput = document.getElementById("speed");
    const submitButton = document.getElementById("submit-button");
    const statusBox = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const resultBox = document.getElementById("result");
    const player = document.getElementById("audio-player");
    const downloadLink = document.getElementById("download-link");

    let currentAudioUrl = null;

    function clearPreviousAudio() {
        player.pause();
        player.removeAttribute("src");
        player.load();
        downloadLink.removeAttribute("href");
        resultBox.hidden = true;
        if (currentAudioUrl !== null) {
            URL.revokeObjectURL(currentAudioUrl);
            currentAudioUrl = null;
        }
    }

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (submitButton.disabled) return;

        const text = textInput.value.trim();
        errorBox.hidden = true;
        errorBox.textContent = "";

        if (!text) {
            errorBox.textContent = "اكتب النص الذي تريد تحويله أولًا.";
            errorBox.hidden = false;
            return;
        }

        clearPreviousAudio();
        submitButton.disabled = true;
        statusBox.textContent = "جاري التحويل... قد يستغرق الطلب الأول وقتًا أطول لتجهيز النموذج.";
        statusBox.hidden = false;

        try {
            const formData = new FormData();
            formData.append("text", text);
            formData.append("speed", speedInput.value);

            const response = await fetch(form.action, {
                method: "POST",
                body: formData,
                headers: {
                    "Accept": "audio/wav, application/json",
                    "X-Requested-With": "fetch"
                },
                cache: "no-store"
            });

            const contentType = response.headers.get("Content-Type") || "";

            if (!response.ok) {
                let message = "تعذر إكمال الطلب. انتظر قليلًا ثم أعد المحاولة.";
                if (contentType.includes("application/json")) {
                    const data = await response.json();
                    if (typeof data.error === "string") message = data.error;
                }
                throw new Error(message);
            }

            if (!contentType.includes("audio/wav")) {
                throw new Error("الخدمة قيد الاستعداد. انتظر قليلًا ثم حاول مجددًا.");
            }

            const audioBlob = await response.blob();
            if (audioBlob.size <= 44) throw new Error("لم يتم إنشاء تسجيل صوتي صالح.");

            currentAudioUrl = URL.createObjectURL(audioBlob);
            player.src = currentAudioUrl;
            downloadLink.href = currentAudioUrl;
            resultBox.hidden = false;
            player.load();

            statusBox.textContent = "تم توليد الصوت بنجاح!";
            try { await player.play(); } catch {}

        } catch (error) {
            statusBox.hidden = true;
            errorBox.textContent = error.message || "حدث خطأ غير متوقع.";
            errorBox.hidden = false;
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
